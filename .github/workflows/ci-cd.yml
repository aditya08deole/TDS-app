name: EvaraTDS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build & Typecheck Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Typecheck & Build
        run: |
          cd backend
          npx tsc --noEmit
          npm run build

      - name: Install Frontend Dependencies
        run: |
          cd admin_dashboard
          npm ci

      - name: Run Frontend Typecheck & Build
        run: |
          cd admin_dashboard
          npx tsc --noEmit
          npm run build
