version: '3.8'

services:
  # ─── 1. Redis Cache Service ───
  redis:
    image: redis:7-alpine
    container_name: tds-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. TDS Backend API Service ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tds-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - SYNC_INTERVAL_HOURS=1
      - CORS_ALL_ORIGINS=true
      - AUTO_TUNNEL=true
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  # ─── 3. Admin Dashboard Frontend Service ───
  frontend:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    container_name: tds-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ─── 4. Public HTTPS Cloudflare Tunnel Service ───
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tds-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:5000
    depends_on:
      - backend

  # ─── 5. Automated Watchtower Zero-Downtime Auto-Updater ───
  watchtower:
    image: containrrr/watchtower:latest
    container_name: tds-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup

volumes:
  redis_data:
    driver: local
