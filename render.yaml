services:
  # 1. Flutter Web App
  - type: web
    name: evaratds-flutter-web
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # 2. Admin Dashboard (React/Vite Static Site)
  - type: web
    name: evaratds-admin-site
    runtime: static
    buildCommand: cd admin_dashboard && npm ci && npm run build
    staticPublishPath: admin_dashboard/dist
    plan: free
    branch: main
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
