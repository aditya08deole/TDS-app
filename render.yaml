services:
  # 1. Flutter Web App (Mobile Client)
  - type: web
    name: evaratds-flutter-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    buildCommand: ""
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # 2. Admin Dashboard (React/Vite) - Static Site is simpler for React
  - type: web
    name: evaratds-admin-panel
    runtime: static
    buildCommand: cd admin_dashboard && npm ci && npm run build
    staticPublishPath: admin_dashboard/dist
    plan: free
    branch: main
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
