services:
  - type: web
    name: evaratds-dashboard
    env: static
    buildCommand: cd admin_dashboard && npm install && npm run build
    staticPublishPath: admin_dashboard/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
